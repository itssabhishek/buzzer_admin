@if (open()) {
  <div class="app-dialog-layer">
    <button class="app-dialog-layer__backdrop" type="button" aria-label="Close dialog" (click)="onBackdropClick()"></button>
    <section class="app-dialog" [class.app-dialog--compact]="size() === 'compact'" role="dialog" aria-modal="true" tabindex="-1" [attr.aria-label]="title()" (keydown)="onKeydown($event)">
      <header class="app-dialog__header">
        <div class="app-dialog__heading">
          <div class="app-dialog__title-row">
            @if (statusIcon(); as statusIcon) {
              <img class="app-dialog__status-icon" [src]="statusIcon" width="40" height="40" alt="" aria-hidden="true" />
            }
            <h2>{{ title() }}</h2>
          </div>
          @if (description(); as description) {
            <p>{{ description }}</p>
          }
        </div>
        <button class="app-dialog__close" type="button" aria-label="Close dialog" (click)="close()"></button>
      </header>
      <div class="app-dialog__content"><ng-content /></div>
      <footer class="app-dialog__actions"><ng-content select="[dialogActions]" /></footer>
    </section>
  </div>
}
