<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-card__brand" aria-label="Buzzer Admin Console">
      <img
        class="login-card__brand-mark"
        src="assets/images/buzzer_admin_console.png"
        width="140"
        height="34"
        alt="Buzzer Admin Console"
        aria-hidden="true"
      />
    </div>

    <h1 id="login-title" class="visually-hidden">Sign in to your account</h1>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <app-field
        label="Email Address*"
        [error]="
          loginForm.controls.email.touched && loginForm.controls.email.invalid
            ? 'Enter a valid email address.'
            : null
        "
      >
        <input
          class="ui-input"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Email Address*"
        />
      </app-field>

      <app-field
        label="Password"
        hint="Use all caps, numbers and symbols"
        [error]="
          loginForm.controls.password.touched && loginForm.controls.password.invalid
            ? 'Enter your password.'
            : null
        "
      >
        <input
          class="ui-input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Password"
        />
      </app-field>

      @if (errorMessage(); as error) {
        <p class="login-card__error" role="alert">{{ error }}</p>
      }

      <app-button type="submit" variant="danger" [fullWidth]="true" [loading]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in…' : 'Login' }}
      </app-button>
    </form>
  </section>
</main>
