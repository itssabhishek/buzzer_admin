<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-card__brand" aria-label="Buzzer Admin Console">
      <span class="login-card__brand-mark" aria-hidden="true">ϟ</span>
      <span>
        <strong>Buzzer</strong>
        <small>Admin Console</small>
      </span>
    </div>

    <div class="login-card__heading">
      <p>Welcome back</p>
      <h1 id="login-title">Sign in to your account</h1>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label>
        Email address
        <input type="email" formControlName="email" autocomplete="email" placeholder="admin@buzzer.dev" />
        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <span class="login-card__field-error">Enter a valid email address.</span>
        }
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <span class="login-card__field-error">Enter your password.</span>
        }
      </label>

      @if (errorMessage(); as error) {
        <p class="login-card__error" role="alert">{{ error }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in…' : 'Login' }}
      </button>
    </form>
  </section>
</main>
