@if (isOpen()) {
  <form [formGroup]="form()" (ngSubmit)="submit()" novalidate>
    <app-dialog [open]="isOpen()" [title]="title()" [statusIcon]="null" (closed)="close()">
      <div class="hierarchy-add-dialog__fields">
        @for (field of fields(); track field.controlName) {
          <app-field [label]="field.label">
            @if (field.type === 'select') {
              <select class="ui-select" [id]="field.controlName" [formControlName]="field.controlName">
                <option value="" disabled>Select {{ field.label.toLowerCase() }}</option>
                @for (option of field.options ?? []; track option.value) { <option [value]="option.value">{{ option.label }}</option> }
              </select>
            } @else {
              <input class="ui-input" [id]="field.controlName" [type]="field.type ?? 'text'" [formControlName]="field.controlName" [placeholder]="field.placeholder ?? ''" />
            }
          </app-field>
        }
        @if (errorMessage()) { <p class="hierarchy-add-dialog__error" role="alert">{{ errorMessage() }}</p> }
      </div>
      <div dialogActions>
        <app-button variant="outline" type="button" [disabled]="isSaving()" (clicked)="close()">Cancel</app-button>
        <app-button type="submit" [disabled]="form().invalid" [loading]="isSaving()">{{ isSaving() ? 'Saving…' : 'Save' }}</app-button>
      </div>
    </app-dialog>
  </form>
}
