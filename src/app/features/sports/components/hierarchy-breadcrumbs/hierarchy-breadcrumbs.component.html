<nav class="breadcrumbs" aria-label="Breadcrumb">
  @for (item of items(); track item.label; let isLast = $last) {
    @if (item.route && !isLast) {
      <a class="breadcrumbs__item" [routerLink]="item.route">{{ item.label }}</a>
    } @else {
      <span class="breadcrumbs__item" [class.breadcrumbs__item--current]="isLast" [attr.aria-current]="isLast ? 'page' : null">{{ item.label }}</span>
    }
  }
</nav>
