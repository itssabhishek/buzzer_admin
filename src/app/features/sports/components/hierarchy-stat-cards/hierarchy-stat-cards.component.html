<div class="stat-cards" aria-label="Entity statistics">
  @if (isLoading()) {
    @for (item of [1, 2, 3]; track item) { <article class="stat-card stat-card--loading" aria-label="Loading statistic"></article> }
  } @else {
    @for (stat of stats(); track stat.label) {
      <article class="stat-card">
        <span class="stat-card__icon" [attr.data-icon]="stat.icon" aria-hidden="true"></span>
        <strong>{{ isNumeric(stat.value) ? (stat.value | number) : stat.value }}</strong>
        <span>{{ stat.label }}</span>
      </article>
    }
  }
</div>
