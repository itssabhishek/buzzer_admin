<app-hierarchy-detail
  [breadcrumbs]="breadcrumbs()"
  eyebrow="Governing body"
  [title]="governingBody()?.name ?? 'Loading governing body…'"
  [recordIcon]="governingBody()?.iconUrl ?? null"
  [metadata]="metadata()"
  metadataLayout="stacked"
  [allowRecordEdit]="canManageHierarchy()"
  [allowRecordDelete]="canManageHierarchy()"
  [stats]="stats()"
  childTableTitle="Organisations"
  [childTableTotal]="organisationMeta().total"
  [childTableColumns]="childColumns"
  [childTableRows]="childRows()"
  [hasChildSearch]="true"
  [childSearch]="organisationSearch()"
  [childPagination]="organisationMeta()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  emptyMessage="This governing body does not have any organisations yet."
  [allowChildEdit]="canManageHierarchy()"
  [allowChildDelete]="canManageHierarchy()"
  [addLabel]="canManageHierarchy() ? 'Organisation' : undefined"
  (addRequested)="openAddDialog()"
  (recordEditRequested)="openGoverningBodyEdit()"
  (recordDeleteRequested)="requestGoverningBodyDelete()"
  (childEditRequested)="openOrganisationEdit($event)"
  (childDeleteRequested)="requestOrganisationDelete($event)"
  (childSearchChanged)="updateOrganisationSearch($event)"
  (childPageChanged)="changeOrganisationPage($event)"
/>

<app-hierarchy-add-dialog
  [isOpen]="addDialogOpen()"
  title="Add Organisation"
  entityLabel="Organisation"
  [form]="organisationForm"
  [fields]="addFields"
  [isSaving]="isAdding()"
  [errorMessage]="addErrorMessage()"
  (closed)="closeAddDialog()"
  (submitted)="addOrganisation()"
/>

<app-hierarchy-add-dialog
  [isOpen]="governingBodyEditDialogOpen()"
  mode="edit"
  title="Edit Governing Body"
  entityLabel="Governing Body"
  [form]="governingBodyForm"
  [fields]="governingBodyEditFields"
  [isSaving]="isSavingEdit()"
  [errorMessage]="editErrorMessage()"
  (closed)="closeEditDialogs()"
  (submitted)="saveGoverningBodyEdit()"
/>

<app-hierarchy-add-dialog
  [isOpen]="organisationEditDialogOpen()"
  mode="edit"
  title="Edit Organisation"
  entityLabel="Organisation"
  [form]="organisationForm"
  [fields]="addFields"
  [isSaving]="isSavingEdit()"
  [errorMessage]="editErrorMessage()"
  (closed)="closeEditDialogs()"
  (submitted)="saveOrganisationEdit()"
/>

@if (deletingGoverningBody() || deletingOrganisation()) {
  <app-dialog [open]="true" size="compact" [title]="'Delete ' + deleteTargetName() + '?'" description="This record will no longer be available in the catalogue." [statusIcon]="null" (closed)="cancelDelete()">
    @if (deleteErrorMessage(); as error) { <p role="alert">{{ error }}</p> }
    <div dialogActions>
      <app-button variant="outline" type="button" [disabled]="isDeleting()" (clicked)="cancelDelete()">Cancel</app-button>
      <app-button variant="danger" type="button" [loading]="isDeleting()" (clicked)="deleteSelected()">Delete</app-button>
    </div>
  </app-dialog>
}
