<app-hierarchy-detail
  [breadcrumbs]="breadcrumbs()"
  eyebrow="Organisation"
  [title]="organisation()?.name ?? 'Loading organisation…'"
  [recordIcon]="organisation()?.iconUrl ?? null"
  [metadata]="metadata()"
  metadataLayout="stacked"
  [allowRecordEdit]="canManageHierarchy()"
  [allowRecordDelete]="canManageHierarchy()"
  [stats]="stats()"
  childTableTitle="Teams"
  [childTableTotal]="teamMeta().total"
  [childTableColumns]="childColumns"
  [childTableRows]="childRows()"
  [hasChildSearch]="true"
  [childSearch]="teamSearch()"
  [childPagination]="teamMeta()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  emptyMessage="This organisation does not have any teams yet."
  [addLabel]="canManageHierarchy() ? 'Team' : undefined"
  (addRequested)="openAddTeamDialog()"
  (childSearchChanged)="updateTeamSearch($event)"
  (childPageChanged)="changeTeamPage($event)"
  (recordEditRequested)="openOrganisationEdit()"
  (recordDeleteRequested)="requestOrganisationDelete()"
/>

@if (organisation(); as currentOrganisation) {
  <app-organisation-members [organizationId]="currentOrganisation.id" />
}

<app-hierarchy-add-dialog
  [isOpen]="addTeamDialogOpen()"
  title="Add Team"
  entityLabel="Team"
  [form]="teamForm"
  [fields]="teamAddFields"
  [isSaving]="isAddingTeam()"
  [errorMessage]="addTeamErrorMessage()"
  (closed)="closeAddTeamDialog()"
  (submitted)="addTeam()"
/>

<app-hierarchy-add-dialog
  [isOpen]="organisationEditDialogOpen()"
  mode="edit"
  title="Edit Organisation"
  entityLabel="Organisation"
  [form]="organisationEditForm"
  [fields]="organisationEditFields"
  [isSaving]="isSavingEdit()"
  [errorMessage]="editErrorMessage()"
  (closed)="closeOrganisationEdit()"
  (submitted)="saveOrganisationEdit()"
/>

@if (deletingOrganisation()) {
  <app-dialog
    [open]="true"
    size="compact"
    [title]="'Delete ' + (organisation()?.name ?? 'this organisation') + '?'"
    description="This record will no longer be available in the catalogue."
    [statusIcon]="null"
    (closed)="cancelDelete()"
  >
    @if (deleteErrorMessage(); as error) {
      <p role="alert">{{ error }}</p>
    }
    <div dialogActions>
      <app-button
        variant="outline"
        type="button"
        [disabled]="isDeleting()"
        (clicked)="cancelDelete()"
      >
        Cancel
      </app-button>
      <app-button
        variant="danger"
        type="button"
        [loading]="isDeleting()"
        (clicked)="deleteOrganisation()"
      >
        Delete
      </app-button>
    </div>
  </app-dialog>
}
