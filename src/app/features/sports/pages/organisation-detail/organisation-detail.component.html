<app-hierarchy-detail
  [breadcrumbs]="breadcrumbs()"
  eyebrow="Organisation"
  [title]="organisation()?.name ?? 'Loading organisation…'"
  [recordIcon]="organisation()?.iconUrl ?? null"
  [metadata]="metadata()"
  metadataLayout="stacked"
  [allowRecordEdit]="canManageHierarchy()"
  [allowRecordDelete]="canManageHierarchy()"
  [stats]="stats()"
  childTableTitle="Participants"
  [childTableTotal]="participants().length"
  [childTableColumns]="childColumns"
  [childTableRows]="childRows()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  emptyMessage="This organisation does not have any participants yet."
  [allowChildEdit]="canManageHierarchy()"
  [allowChildDelete]="canManageHierarchy()"
  [addLabel]="canManageHierarchy() ? 'Team' : undefined"
  [secondaryAddLabel]="canManageHierarchy() ? 'Participant' : undefined"
  (addRequested)="openAddTeamDialog()"
  (secondaryAddRequested)="openAddDialog()"
  (recordEditRequested)="openOrganisationEdit()"
  (recordDeleteRequested)="requestOrganisationDelete()"
  (childEditRequested)="openParticipantEdit($event)"
  (childDeleteRequested)="requestParticipantDelete($event)"
/>

@if (organisation(); as currentOrganisation) {
  <app-organisation-members [organizationId]="currentOrganisation.id" />
}

<app-hierarchy-add-dialog
  [isOpen]="addTeamDialogOpen()"
  title="Add Team"
  entityLabel="Team"
  [form]="teamForm"
  [fields]="teamAddFields"
  [isSaving]="isAddingTeam()"
  [errorMessage]="addTeamErrorMessage()"
  (closed)="closeAddTeamDialog()"
  (submitted)="addTeam()"
/>

<app-hierarchy-add-dialog
  [isOpen]="addDialogOpen()"
  title="Add Participant"
  entityLabel="Participant"
  [form]="participantForm"
  [fields]="addFields()"
  [isSaving]="isAdding()"
  [errorMessage]="addErrorMessage()"
  (closed)="closeAddDialog()"
  (submitted)="addParticipant()"
/>

<app-hierarchy-add-dialog
  [isOpen]="organisationEditDialogOpen()"
  mode="edit"
  title="Edit Organisation"
  entityLabel="Organisation"
  [form]="organisationEditForm"
  [fields]="organisationEditFields"
  [isSaving]="isSavingEdit()"
  [errorMessage]="editErrorMessage()"
  (closed)="closeEditDialogs()"
  (submitted)="saveOrganisationEdit()"
/>

<app-hierarchy-add-dialog
  [isOpen]="participantEditDialogOpen()"
  mode="edit"
  title="Edit Participant"
  entityLabel="Participant"
  [form]="participantForm"
  [fields]="addFields()"
  [isSaving]="isSavingEdit()"
  [errorMessage]="editErrorMessage()"
  (closed)="closeEditDialogs()"
  (submitted)="saveParticipantEdit()"
/>

@if (deletingOrganisation() || deletingParticipant()) {
  <app-dialog [open]="true" size="compact" [title]="'Delete ' + deleteTargetName() + '?'" description="This record will no longer be available in the catalogue." [statusIcon]="null" (closed)="cancelDelete()">
    @if (deleteErrorMessage(); as error) { <p role="alert">{{ error }}</p> }
    <div dialogActions>
      <app-button variant="outline" type="button" [disabled]="isDeleting()" (clicked)="cancelDelete()">Cancel</app-button>
      <app-button variant="danger" type="button" [loading]="isDeleting()" (clicked)="deleteSelected()">Delete</app-button>
    </div>
  </app-dialog>
}
