<app-hierarchy-detail
  [breadcrumbs]="breadcrumbs()"
  eyebrow="Participant"
  [title]="title()"
  [description]="team() ? 'Part of ' + team()?.name : null"
  [stats]="stats()"
  childTableTitle="Team Members"
  [childTableTotal]="teamMemberTotal()"
  [childTableColumns]="childColumns"
  [childTableRows]="childRows()"
  [hasChildSearch]="true"
  [childSearch]="teammateSearch()"
  [childPagination]="teammateMeta()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  emptyMessage="This participant does not have any teammates yet."
  [addLabel]="canManageHierarchy() ? 'Participant' : undefined"
  (addRequested)="openAddDialog()"
  (childSearchChanged)="updateTeammateSearch($event)"
  (childPageChanged)="changeTeammatePage($event)"
/>

<app-hierarchy-add-dialog
  [isOpen]="addDialogOpen()"
  title="Add Participant"
  entityLabel="Participant"
  [form]="participantForm"
  [fields]="addFields"
  [isSaving]="isAdding()"
  [errorMessage]="addErrorMessage()"
  (closed)="closeAddDialog()"
  (submitted)="addParticipant()"
/>
