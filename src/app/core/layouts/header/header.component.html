<header class="header">
  <div class="header__title-group">
    <button class="header__menu" type="button" (click)="toggleMenu()" aria-label="Toggle sidebar">
      <img src="assets/svg/Icons=ic_kebab.svg" width="24" height="24" alt="" aria-hidden="true" />
    </button>
    <h1>{{ pageTitle() }}</h1>
  </div>

  <app-search-field class="header__search" [value]="searchTerm()" (valueChange)="updateSearch($event)" />
</header>
