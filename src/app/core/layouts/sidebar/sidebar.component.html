<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <div class="sidebar__header">
    <a class="sidebar__brand" routerLink="/dashboard" aria-label="Buzzer Admin Console">
      @if (!collapsed()) {
        <img
          class="sidebar__brand-mark"
          src="assets/images/buzzer_admin_console.png"
          width="100"
          height="24"
          alt="Buzzer Admin Console"
          aria-hidden="true"
        />
      } @else {
        <img
          class="sidebar__brand-mark-collapsed"
          src="assets/svg/Icons=ic_buzzer_logo.svg"
          width="24"
          height="24"
          alt="Buzzer Admin Console"
          aria-hidden="true"
        />
      }
    </a>

    <button
      class="sidebar__collapse"
      type="button"
      (click)="toggle()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <img
        [class.sidebar__collapse-icon--reversed]="!collapsed()"
        src="assets/svg/Icons=ic_right_clear.svg"
        width="24"
        height="24"
        alt=""
        aria-hidden="true"
      />
    </button>
  </div>

  <nav class="sidebar__nav">
    @for (section of sections; track section.label) {
      <section class="sidebar__section">
        @if (!collapsed()) {
          <p class="sidebar__section-label">{{ section.label }}</p>
        }

        @for (item of section.items; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="onNavigate()"
            [attr.aria-label]="item.label"
            [title]="collapsed() ? item.label : null"
          >
            <img
              class="sidebar__item-icon"
              [src]="iconPath(item.icon)"
              width="20"
              height="20"
              alt=""
              aria-hidden="true"
            />
            @if (!collapsed()) {
              <span class="sidebar__item-label">{{ item.label }}</span>
            }
          </a>
        }
      </section>
    }
  </nav>

  <div class="sidebar__account">
    <span class="sidebar__avatar">A</span>
    @if (!collapsed()) {
      <span class="sidebar__account-copy">
        <span>{{ user()?.email ?? 'Admin user' }}</span>
        <button class="sidebar__sign-out" type="button" (click)="logout()">Sign out</button>
      </span>
    }
  </div>
</aside>
